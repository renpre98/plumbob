[package]
name = "plumbob"
version = "1.0.0"
edition = "2021"
authors = ["renpre98 <reno.p@hotmail.de>"]
license = "MIT"
description = "Linux driver and middleware for the SteelSeries Sims 4 USB Plumbob (1038:1500)"

[lib]
name = "plumbob"
path = "src/lib.rs"

[[bin]]
name = "plumbob"
path = "src/main.rs"

[[bin]]
name = "plumbob-daemon"
path = "src/bin/daemon.rs"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
strip = true
